<!DOCTYPE html>
<html>
<head>
  <title>Instrument Panel</title>
</head>
<body>
  <h1>Instrument Panel</h1>
  <pre id="readout">Waiting for data...</pre>

  <script>
    const socket = new WebSocket("ws://localhost:3000");

    socket.onopen = () => {
      console.log("Connected to server");
    };

    socket.onmessage = (event) => {
      const sensors = JSON.parse(event.data);
      document.getElementById("readout").textContent = JSON.stringify(sensors, null, 2);
    };

    socket.onclose = () => {
      console.log("Disconnected from server");
    };
  </script>
</body>
</html>
